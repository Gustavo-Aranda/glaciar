<button id="chatbot-toggle-btn" class="chatbot-toggle-btn" aria-label="Abrir assistente virtual">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
    </svg>
</button>

<div id="chatbot-window" class="chatbot-window hidden" role="dialog" aria-label="Assistente Virtual Glaucia">
    <div class="chat-header">
        <div class="chat-title-group">
            <h4>Glaucia</h4>
            <span>Assistente de Recomendação</span>
        </div>
        <button id="chatbot-close-btn" class="btn-close-chat" aria-label="Fechar">&times;</button>
    </div>

    <div class="chat-quick-prompts" id="chat-quick-prompts">
        <button type="button" class="chip-prompt" data-prompt="Vou fazer uma expedição em alta montanha com neve. O que me recomenda?">🏔️ Alta Montanha / Neve</button>
        <button type="button" class="chip-prompt" data-prompt="Busco equipamentos leves e respiráveis para trekking de verão. O que indica?">☀️ Trekking Leve / Verão</button>
        <button type="button" class="chip-prompt" data-prompt="Quero montar um acampamento resistente a ventos fortes e frio.">⛺ Acampamento 4 Estações</button>
    </div>

    <div class="chat-body" id="chat-body">
        <div class="message bot-message" id="chat-welcome-msg">
            Olá! Sou a assistente virtual da Glaciar, <b>Glaucia!</b><br>
            Posso te recomendar o equipamento ideal. Qual clima ou terreno você vai enfrentar na próxima expedição?
        </div>
    </div>

    <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Ex: Preciso de uma bota ou barraca para neve..." maxlength="600" autocomplete="off">
        <button id="chat-send-btn" class="btn-send-chat" aria-label="Enviar mensagem">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
</div>
