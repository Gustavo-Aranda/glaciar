<!-- Botão Flutuante (estilo Messenger) -->
<button id="chatbot-toggle-btn" class="chatbot-toggle-btn" aria-label="Abrir assistente virtual">
    <!-- Ícone de Chat SVG -->
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
    </svg>
</button>

<!-- Janela do Chat (Oculta por padrão) -->
<div id="chatbot-window" class="chatbot-window hidden">
    
    <!-- Cabeçalho do Chat -->
    <div class="chat-header">
        <div class="chat-title-group">
            <h4>Glaucia</h4>
            <span>Assistente de Recomendação</span>
        </div>
        <button id="chatbot-close-btn" class="btn-close-chat" aria-label="Fechar">&times;</button>
    </div>

    <!-- Corpo (Histórico de Mensagens) -->
    <div class="chat-body" id="chat-body">
        <div class="message bot-message">
            Olá! Sou a assistente virtual da Glaciar, <b>Glaucia!</b>. <br>Vai enfrentar qual clima na sua próxima expedição? Posso te recomendar o equipamento ideal!
        </div>
    </div>

    <!-- Área de Digitação -->
    <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Ex: Preciso de uma bota para neve..." autocomplete="off">
        <button id="chat-send-btn" class="btn-send-chat" aria-label="Enviar mensagem">
            <!-- Ícone de Enviar SVG -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
</div>
