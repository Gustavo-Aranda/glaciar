<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vestuário Masculino | Glaciar</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/pages/catalogo.css">
    <link rel="stylesheet" href="./css/components/chatbot.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="catalog-page">
        <header class="catalog-header">
            <nav class="breadcrumb" aria-label="Breadcrumb">
                <a href="index.html">Home</a>
                <span class="separator">&gt;</span>
                <span class="current">Masculino</span>
            </nav>
            <h1>Masculino</h1>
        </header>

        <div class="catalog-layout">
            <!-- Barra Lateral (Empurrada mais para a esquerda pelo CSS) -->
            <aside class="filters-sidebar">
                <div class="filter-group"><h4>Categoria <span class="arrow">v</span></h4></div>
                <div class="filter-group"><h4>Preço <span class="arrow">v</span></h4></div>
                <div class="filter-group"><h4>Tamanho <span class="arrow">v</span></h4></div>
                <div class="filter-group"><h4>Cor <span class="arrow">v</span></h4></div>
            </aside>

            <section class="products-grid-container">
                <div class="grid-controls">
                    <span class="items-count">636 Itens</span>
                    <div class="sort-by">Ordenar Por <strong>Mais Relevantes</strong> <span class="arrow">v</span></div>
                </div>

                <div class="products-grid">
                    
                    <!-- Produto Exemplo: Short com Adição Rápida Funcional -->
                    <article class="product-card">
                        <div class="product-img-wrapper">
                            <span class="badge badge-white">Novo</span>
                            <a href="produto.html" class="img-link">
                                <div class="img-placeholder" style="background-image: url(./assets/img/destaque-1.jpg)"></div>
                            </a>
                            
                            <!-- Botão Inicial -->
                            <button class="btn-quick-add" onclick="toggleSizeSelector(this)">Adição Rápida</button>
                            
                            <!-- Grade de Tamanhos (Inspirado na Imagem 1) -->
                            <div class="size-selector-overlay hidden">
                                <button class="btn-size" onclick="addToBag('P')">P</button>
                                <button class="btn-size" onclick="addToBag('M')">M</button>
                                <button class="btn-size" onclick="addToBag('G')">G</button>
                                <button class="btn-size" onclick="addToBag('GG')">GG</button>
                                <button class="btn-size disabled" disabled>2GG</button>
                                <button class="btn-close-sizes" onclick="toggleSizeSelector(this.parentElement)">&times;</button>
                            </div>
                        </div>
                        
                        <div class="product-info">
                            <div class="color-swatches">
                                <span class="swatch checked" style="background: #6a2e41;"></span>
                                <span class="swatch" style="background: #111;"></span>
                                <span class="swatch" style="background: #2c3e50;"></span>
                                <span class="swatch-more">+1</span>
                            </div>
                            <h3 class="product-title"><a href="produto.html">Alpine Pro SV</a></h3>
                            <p class="product-price">R$ 490,00</p>
                            <div class="product-tags">
                                <span class="tag">secagem rápida</span>
                                <span class="tag">stretch</span>
                            </div>
                        </div>
                    </article>

                </div>
            </section>
        </div>

        <!-- NOTIFICAÇÃO DE CARRINHO (Inspirado na Imagem 2) -->
        <div id="cart-toast" class="cart-toast hidden">
            <div class="toast-header">
                <h3>Adicionado ao Carrinho <span class="check-icon">✓</span></h3>
                <button class="btn-close-toast" onclick="closeToast()">&times;</button>
            </div>
            <div class="toast-body">
                <div class="toast-img" style="background-image: url('./assets/img/destaque-1.jpg');"></div>
                <div class="toast-details">
                    <p class="toast-title">1x Jaqueta Alpine Pro SV</p>
                    <p class="toast-price">R$ 490,00</p>
                    <p class="toast-attr">Cor: Berry Fig</p>
                    <p class="toast-attr">Tamanho: <span id="toast-size">M</span></p>
                </div>
            </div>
            <div class="toast-actions">
                <a href="carrinho.html" class="btn-black-full">Checkout</a>
                <button class="btn-outline-full" onclick="closeToast()">Continue Comprando</button>
            </div>
        </div>

    </main>

    <script src="./js/components/layout.js"></script>
    <script src="./js/pages/catalog.js"></script>
    <script src="./js/components/chatbot.js"></script>
</body>
</html>
