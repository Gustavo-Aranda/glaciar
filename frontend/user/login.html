<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Glaciar</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/pages/login.css">
</head>
<body>
    <main class="login-page">
        <div class="login-container">
            
            <!-- COLUNA ESQUERDA: Formulário de Login -->
            <section class="login-section">
                <h1>Entrar.</h1>
                
                <form id="loginForm" class="login-form">
                    <div class="input-group">
                        <label for="email">E-mail *</label>
                        <input type="email" id="email" autocomplete="email" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Senha *</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" autocomplete="current-password" required>
                            <button type="button" class="btn-toggle-pass" aria-label="Mostrar senha">
                                <img src="./assets/icons/eye-slash-regular-full.svg" alt="Visualizar">
                            </button>
                        </div>
                    </div>

                    <a href="#recuperar" class="forgot-password">Esqueceu a senha?</a>

                    <p id="mensagem-login" class="mensagem-login" role="alert" aria-live="polite"></p>
                    <button type="submit" class="btn-login-black" id="btn-login">Entrar</button>
                </form>

                <div class="create-account-prompt">
                    <p>Não tem uma conta?</p>
                    <a href="cadastro.html">Crie Uma Agora</a>
                </div>
            </section>

            <!-- COLUNA DIREITA: Rastreio de Visitante -->
            <section class="guest-section">
                <div class="guest-box">
                    <h2>Procurando seu pedido?</h2>
                    <p>Veja o status do seu equipamento mesmo se você não for um usuário cadastrado. Informe o número do pedido e seu sobrenome.</p>
                    <a href="#rastreio-visitante" class="btn-guest-outline">Encontrar Pedido</a>
                </div>
            </section>

        </div>
    </main>

    <script src="./js/pages/login.js"></script>
</body>
</html>
