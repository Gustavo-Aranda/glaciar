<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Glaciar</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/pages/cadastro.css">
</head>
<body>
    <main class="cadastro-page">
        <div class="cadastro-container">
            <section class="cadastro-section" aria-labelledby="titulo-cadastro">
                <h1 id="titulo-cadastro">Criar conta.</h1>

                <form id="form-registrar-cliente" class="cadastro-form">
                    <div class="input-group">
                        <label for="nome">Nome *</label>
                        <input type="text" id="nome" autocomplete="given-name" required>
                    </div>
                    <div class="input-group">
                        <label for="sobrenome">Sobrenome *</label>
                        <input type="text" id="sobrenome" autocomplete="family-name" required>
                    </div>
                    <div class="input-group">
                        <label for="cpf">CPF *</label>
                        <input type="text" id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off" required>
                    </div>
                    <div class="input-group">
                        <label for="email">E-mail *</label>
                        <input type="email" id="email" autocomplete="email" required>
                    </div>
                    <div class="input-group">
                        <label for="senha">Senha *</label>
                        <input type="password" id="senha" autocomplete="new-password" required>
                    </div>

                    <p id="mensagem-cadastro" class="mensagem-cadastro" role="alert" aria-live="polite"></p>
                    <button type="submit" class="btn-cadastro-black" id="btn-cadastrar">Criar conta</button>
                </form>

                <div class="cadastro-login-prompt">
                    <p>Já possui uma conta?</p>
                    <a href="login.html">Entrar</a>
                </div>
            </section>

            <section class="login-prompt-section">
                <div class="login-prompt-box">
                    <h2>Já faz parte da Glaciar?</h2>
                    <p>Entre na sua conta para acompanhar pedidos, consultar seus dados e continuar sua experiência.</p>
                    <a href="login.html" class="btn-login-outline">Entrar na conta</a>
                </div>
            </section>
        </div>
    </main>

    <div id="loading-cadastro" class="loading-cadastro hidden" role="status" aria-live="polite" aria-busy="true">
        <div class="loading-cadastro-conteudo">
            <span class="loading-cadastro-spinner" aria-hidden="true"></span>
            <span>Processando cadastro...</span>
        </div>
    </div>
    
    <script src="./js/pages/cadastro.js"></script>
</body>
</html>
