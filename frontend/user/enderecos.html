<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endereços | Glaciar</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/pages/enderecos.css">
    <link rel="stylesheet" href="./css/components/chatbot.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="addresses-page">
        <div class="content-header">
            <nav class="breadcrumb" aria-label="Breadcrumb">
                <a href="conta.html">Minha Conta</a>
                <span class="separator">&gt;</span>
                <span class="current">Endereços</span>
            </nav>
            <h2>Gerenciar Endereços</h2>
            <p>Cadastre os endereços usados para receber seus pedidos.</p>
        </div>

        <section class="addresses-section" aria-labelledby="titulo-enderecos">
            <div class="addresses-header">
                <h3 id="titulo-enderecos">Meus endereços</h3>
                <button type="button" class="address-add-button" id="btn-novo-endereco">+ Adicionar endereço</button>
            </div>
            <div class="addresses-list" id="lista-enderecos" aria-live="polite">
                <p class="addresses-feedback">Carregando endereços...</p>
            </div>
        </section>
    </main>

    <div class="address-modal hidden" id="modal-endereco" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-endereco">
        <div class="address-modal-content">
            <div class="address-modal-header">
                <div>
                    <span class="address-modal-kicker">Cadastro</span>
                    <h3 id="titulo-modal-endereco">Adicionar endereço</h3>
                </div>
                <button type="button" class="address-close-button" id="btn-fechar-modal" aria-label="Fechar modal">&times;</button>
            </div>

            <form id="form-endereco" class="address-form">
                <div class="address-form-row">
                    <div class="address-field address-field-wide">
                        <label for="endereco-apelido">Apelido *</label>
                        <input type="text" id="endereco-apelido" maxlength="50" placeholder="Ex.: Casa" required>
                    </div>
                    <label class="address-default-field" for="endereco-padrao">
                        <input type="checkbox" id="endereco-padrao">
                        <span>Usar como endereço padrão</span>
                    </label>
                </div>
                <div class="address-form-row">
                    <div class="address-field">
                        <label for="endereco-cep">CEP *</label>
                        <input type="text" id="endereco-cep" inputmode="numeric" maxlength="9" placeholder="00000-000" required>
                    </div>
                    <div class="address-field address-field-wide">
                        <label for="endereco-logradouro">Logradouro *</label>
                        <input type="text" id="endereco-logradouro" maxlength="100" required>
                    </div>
                    <div class="address-field">
                        <label for="endereco-numero">Número *</label>
                        <input type="text" id="endereco-numero" maxlength="10" required>
                    </div>
                </div>
                <div class="address-form-row">
                    <div class="address-field address-field-wide">
                        <label for="endereco-complemento">Complemento</label>
                        <input type="text" id="endereco-complemento" maxlength="100">
                    </div>
                    <div class="address-field address-field-wide">
                        <label for="endereco-bairro">Bairro *</label>
                        <input type="text" id="endereco-bairro" maxlength="100" required>
                    </div>
                </div>
                <div class="address-form-row">
                    <div class="address-field address-field-wide">
                        <label for="endereco-cidade">Cidade *</label>
                        <input type="text" id="endereco-cidade" maxlength="100" required>
                    </div>
                    <div class="address-field">
                        <label for="endereco-estado">Estado *</label>
                        <select id="endereco-estado" required>
                            <option value="">Selecione</option>
                            <option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option><option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option><option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option><option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option><option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option><option>SE</option><option>TO</option>
                        </select>
                    </div>
                </div>
                <p class="address-form-message" id="mensagem-endereco" role="alert" aria-live="polite"></p>
                <div class="address-modal-actions">
                    <button type="button" class="address-cancel-button" id="btn-cancelar-endereco">Cancelar</button>
                    <button type="submit" class="address-save-button" id="btn-salvar-endereco">Salvar endereço</button>
                </div>
            </form>
        </div>
    </div>

    <div class="address-modal hidden" id="modal-remover-endereco" role="dialog" aria-modal="true" aria-labelledby="titulo-remover-endereco">
        <div class="address-delete-modal-content">
            <div class="address-delete-icon" aria-hidden="true">!</div>
            <h3 id="titulo-remover-endereco">Remover endereço</h3>
            <p>Você está prestes a remover permanentemente:</p>
            <strong id="nome-remover-endereco"></strong>
            <span id="detalhes-remover-endereco"></span>
            <p class="address-delete-warning">Essa ação não poderá ser desfeita.</p>
            <div class="address-modal-actions">
                <button type="button" class="address-cancel-button" id="btn-cancelar-remocao">Cancelar</button>
                <button type="button" class="address-remove-confirm-button" id="btn-confirmar-remocao">Remover endereço</button>
            </div>
        </div>
    </div>

    <script src="./js/components/usuario-session.js"></script>
    <script src="./js/components/layout.js"></script>
    <script src="./js/components/chatbot.js"></script>
    <script src="./js/pages/enderecos.js"></script>
</body>
</html>
