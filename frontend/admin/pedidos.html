<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pedidos | Glaciar Admin</title>

    <link rel="stylesheet" href="../user/css/global.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/pages/pedidos.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="admin-container">
        <div id="sidebar-placeholder"></div>

        <section class="admin-content">
            <div class="content-wrapper">
                <div class="content-header">
                    <h2>Gestão Operacional de Pedidos</h2>
                    <p>Gerencie a fila de tarefas logísticas, aprovação de pagamentos e despacho de mercadorias.</p>
                </div>

                <section class="admin-section">
                    <div class="search-bar-container">
                        <input type="text" id="search-pedidos" class="admin-search-input" placeholder="Buscar pedido por número, cliente ou status...">
                        <button class="btn btn-secondary" id="btn-buscar-pedidos">Buscar</button>
                    </div>
                    <div id="pedidos-container">
                        <p>Carregando pedidos...</p>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <div id="notificacoes-container" class="notificacoes-container" aria-live="polite"></div>

    <script src="./js/components/layout.js"></script>
    <script src="./js/components/notifications.js"></script>
    <script src="./js/pages/pedidos.js"></script>
</body>
</html>
