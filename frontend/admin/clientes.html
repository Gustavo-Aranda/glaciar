<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Clientes | Glaciar Admin</title>
    <link rel="stylesheet" href="../user/css/global.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/pages/clientes.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="admin-container">
        <div id="sidebar-placeholder"></div>

        <section class="admin-content">
            <div class="content-wrapper">
                
                <div class="content-header">
                    <nav class="breadcrumb" aria-label="Breadcrumb">
                        <a href="index.html">Painel Administrativo</a>
                        <span class="separator">&gt;</span>
                        <span class="current">Gestão de Clientes</span>
                    </nav>

                    <h2>Gestão de Clientes</h2>
                    <p>Consulte a base de usuários, analise perfis e realize a inativação de contas.</p>
                </div>

                <section class="admin-section">
                    <div class="search-bar-container">
                        <input type="text" id="input-busca" class="admin-search-input" placeholder="Buscar cliente por nome, CPF ou e-mail...">
                        <button class="btn btn-secondary" onclick="carregarClientes()">Buscar</button>
                        <button class="btn btn-primary" id="btn-novo-cliente">+ Criar Cliente</button>
                    </div>

                    <!-- O contêiner agora fica vazio aguardando o JavaScript -->
                    <div class="clients-list" id="lista-clientes-container">
                        <p>Carregando clientes do banco de dados...</p>
                    </div>
                </section>
            </div>
        </section>
    </main>
    <div id="modal-criar-cliente" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Cadastrar Novo Cliente</h3>
                <button class="btn-close-modal" id="btn-close-modal">&times;</button>
            </div>
            
            <form class="admin-form" id="form-criar-cliente">
                <!-- Dados Pessoais -->
                <div class="form-row">
                    <div class="input-group">
                        <label>Tipo de Conta *</label>
                        <select id="tipoUsuario" required>
                            <option value="0">Cliente Comum (CLI)</option>
                            <option value="1">Administrador (ADM)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Senha Inicial *</label>
                        <input type="password" id="senha" placeholder="Senha provisória" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label>Nome *</label>
                        <input type="text" id="nome" required>
                    </div>
                    <div class="input-group">
                        <label>Sobrenome *</label>
                        <input type="text" id="sobrenome" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="input-group">
                        <label>CPF *</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00" required>
                    </div>
                    <div class="input-group">
                        <label>E-mail *</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="input-group">
                        <label>Telefone *</label>
                        <input type="text" id="telefone" placeholder="(00) 00000-0000" required>
                    </div>
                </div>

                <h4 class="form-subtitle">Endereço de Entrega Base</h4>

                <div class="form-row">
                    <div class="input-group">
                        <label>CEP *</label>
                        <input type="text" id="cep" placeholder="00000-000" required>
                    </div>
                    <div class="input-group" style="flex: 2;">
                        <label>Logradouro *</label>
                        <input type="text" id="logradouro" required>
                    </div>
                    <div class="input-group">
                        <label>Número *</label>
                        <input type="text" id="numero" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label>Complemento</label>
                        <input type="text" id="complemento">
                    </div>
                    <div class="input-group">
                        <label>Cidade *</label>
                        <input type="text" id="cidade" required>
                    </div>
                    <div class="input-group">
                        <label>Estado *</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" id="estado" placeholder="UF" style="width: 60px;" required>
                        </div>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="btn-cancelar-modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Cliente</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="./js/components/layout.js"></script>
    <script src="./js/pages/create-client.js"></script>
</body>
</html>
