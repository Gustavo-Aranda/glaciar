version: "3.8"

services:
  api:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: glaciar-api
    ports:
      - "5205:8080"
    environment:
      # O .NET vai ler a string de conexão do Supabase daqui em tempo de execução
      - ConnectionStrings__DefaultConnection=${SUPABASE_CONNECTION}
      # Chave do Google AI Studio (defina GEMINI_API_KEY no .env); modelo configurável
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - Gemini__Model=${GEMINI_MODEL:-gemini-3.8-flash}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glaciar-frontend
    ports:
      - "5500:80"
    depends_on:
      - api
    restart: unless-stopped