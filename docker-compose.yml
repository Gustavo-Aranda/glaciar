services:
  ollama:
    image: ollama/ollama:latest
    container_name: glaciar-ollama
    # Segurança: o Ollama não possui autenticação. A porta é publicada SOMENTE no loopback
    # (127.0.0.1) do host, para que o `dotnet run` local continue acessando http://localhost:11434,
    # sem expor o serviço à rede (ex: Wi-Fi da apresentação). Dentro do Docker, a API acessa
    # pela rede interna (http://ollama:11434), sem depender dessa porta.
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_BASE_MODEL=${OLLAMA_BASE_MODEL:-llama3.2}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-glaciar-assistant}
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama:/ollama-init:ro
    # Executa o script diretamente (sh vira o PID 1) para que o `trap` receba o SIGTERM do `docker stop`.
    # O .gitattributes garante final de linha LF no entrypoint.sh, mesmo em checkouts no Windows.
    entrypoint: ["/bin/sh", "/ollama-init/entrypoint.sh"]
    # Só fica "healthy" depois que o modelo customizado foi criado (o primeiro pull pode levar minutos).
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q \"$${OLLAMA_MODEL:-glaciar-assistant}\""]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15m
    networks:
      - glaciar-net
    restart: unless-stopped

  api:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: glaciar-api
    ports:
      - "5205:8080"
    environment:
      # String de conexão do Supabase lida em tempo de execução
      - ConnectionStrings__DefaultConnection=${SUPABASE_CONNECTION}
      # Configuração da inferência local via Ollama na mesma rede Docker
      - Ollama__BaseUrl=${OLLAMA_BASE_URL:-http://ollama:11434}
      - Ollama__Model=${OLLAMA_MODEL:-glaciar-assistant}
      - Ollama__Temperature=${OLLAMA_TEMPERATURE:-0.2}
      - Ollama__MaxTokens=${OLLAMA_MAX_TOKENS:-600}
      - Ollama__TimeoutSeconds=${OLLAMA_TIMEOUT_SECONDS:-120}
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - glaciar-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glaciar-frontend
    ports:
      - "5500:80"
    depends_on:
      - api
    networks:
      - glaciar-net
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  glaciar-net:
    driver: bridge
